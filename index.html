<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Querithm</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Start screen (§16): the theme and the loader are there for the first frame, before the app's bundle runs.
         Files, never an inline script or style element: see public/boot-splash.css. -->
    <script src="/boot-theme.js"></script>
    <link rel="stylesheet" href="/boot-splash.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999"></div>
    <!-- Shown until the app has started (src/app/splash.ts sets data-stage and the line of text). -->
    <div id="splash" data-stage="1">
      <svg class="splash-mark" viewBox="102 71 368 368" aria-hidden="true">
        <defs>
          <linearGradient id="splash-body" gradientUnits="userSpaceOnUse" x1="140" y1="92" x2="330" y2="390">
            <stop offset="0" class="splash-ba" />
            <stop offset=".55" class="splash-bb" />
            <stop offset="1" class="splash-bc" />
          </linearGradient>
          <linearGradient id="splash-pulse" gradientUnits="userSpaceOnUse" x1="296" y1="0" x2="450" y2="0">
            <stop offset="0" class="splash-ua" />
            <stop offset="1" class="splash-ub" />
          </linearGradient>
        </defs>
        <g class="splash-tier splash-t1">
          <path class="splash-idle" fill-rule="evenodd" d="M108 180 A148 88 0 0 1 404 180 A148 88 0 0 1 108 180 Z M152 180 A104 48 0 0 0 360 180 A104 48 0 0 0 152 180 Z" />
          <path class="splash-lit" fill-rule="evenodd" fill="url(#splash-body)" d="M108 180 A148 88 0 0 1 404 180 A148 88 0 0 1 108 180 Z M152 180 A104 48 0 0 0 360 180 A104 48 0 0 0 152 180 Z" />
        </g>
        <g class="splash-tier splash-t2">
          <path class="splash-idle" fill-rule="evenodd" d="M108 214 A148 78 0 0 0 262 291.9 L262 327.9 A148 84 0 0 1 108 244 Z" />
          <path class="splash-lit" fill-rule="evenodd" fill="url(#splash-body)" d="M108 214 A148 78 0 0 0 262 291.9 L262 327.9 A148 84 0 0 1 108 244 Z" />
        </g>
        <g class="splash-tier splash-t3">
          <path class="splash-idle" fill-rule="evenodd" d="M108 274 A148 78 0 0 0 316 345.3 L316 380.8 A148 84 0 0 1 108 304 Z" />
          <path class="splash-lit" fill-rule="evenodd" fill="url(#splash-body)" d="M108 274 A148 78 0 0 0 316 345.3 L316 380.8 A148 84 0 0 1 108 304 Z" />
        </g>
        <path class="splash-track" d="M300 310 L330 310 L352 278 L388 400 L414 310 L446 310" />
        <path class="splash-pulse" pathLength="100" stroke="url(#splash-pulse)" d="M300 310 L330 310 L352 278 L388 400 L414 310 L446 310" />
      </svg>
      <div class="splash-name">Querithm</div>
      <div class="splash-stage" role="status"><span id="splash-text">Starting the engine…</span><span id="splash-elapsed"></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
