# gitleaks configuration for local and CI scans of the tree and the history (`gitleaks git`, `gitleaks dir`).
# It keeps every default rule. The allowlists below name exact files and, where a file holds real code, the exact fake
# value too, so a new secret anywhere else still fails the scan.
[extend]
useDefault = true

[[allowlists]]
description = "Local Docker SSH fixture keys: only scripts/bench/docker/ssh/ may hold credentials, and they work only against the fixture bound to 127.0.0.1"
paths = ['''^scripts/bench/docker/ssh/test_(ed25519|rsa_pass)$''']

# Rule-level (generic-api-key only) and path AND value: `gitleaks dir` ignores `condition` on a global allowlist and
# would skip these files whole, src-tauri/src/shell_log.rs included. Paths are relative: run gitleaks from the repo root.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Fake values in tests: a deliberately wrong password, a placeholder launch token, a fake saved secret, a wrong SSH passphrase and an unclosed-quote password"
  condition = "AND"
  paths = [
    '''^sidecar/Querithm\.Tests/Integration/CoverageSessionIntegrationTests\.cs$''',
    '''^src-tauri/src/shell_log\.rs$''',
    '''^scripts/__tests__/dev-bridge\.test\.ts$''',
    '''^sidecar/Querithm\.Tests/SshSignInMatrixTests\.cs$''',
    '''^sidecar/Querithm\.Tests/Security/PentestSecretLeakTests\.cs$''',
  ]
  regexes = ['''^wrong\-pw\-xyz\-123$''', '''^0123456789abcdef0123456789abcdef$''', '''^private\-db\-zz1$''', '''^wrong\-phrase\-42$''', '''^zq10\-unclosed\-ms$''']

  [[rules.allowlists]]
  description = "The Oracle Free fixture's monitor-account password (D4 S01): scripts/bench/docker/compose.yml is one of the two files that may hold fixture credentials (CLAUDE.md §3), and the account exists only in the fixture bound to 127.0.0.1"
  condition = "AND"
  paths = ['''^scripts/bench/docker/compose\.yml$''']
  regexes = ['''^Querithm_Mon_2026$''']
