# pnpm workspace root (§3). The webview lives at the repo root; Rust and .NET build with their own tools.
packages:
  - "."
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
# GHSA-g3hv-75wg-m249 (minimatch < 11.0.1, glob-pattern amplification): linaria (via glide-data-grid) asks for ^9 and
# only uses `new Minimatch(pattern).match(path)`, which 11.x keeps (ARCHITECTURE §16).
overrides:
  minimatch: ^11.0.4
